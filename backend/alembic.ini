# -*- coding: utf-8 -*-
# Alembic 迁移配置（AI Novel Forge）
# 使用：alembic revision --autogenerate -m "xxx" / alembic upgrade head

[alembic]
# 版本脚本目录
script_location = alembic
# 模板使用 generic（SQLAlchemy 2.x）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# 时区
timezone = Asia/Shanghai

# 数据库连接 URL（可被环境变量 DATABASE_URL 覆盖，见 env.py）
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/novelforge


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
